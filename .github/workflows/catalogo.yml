name: Atualizar catálogo de fundos
on:
  push:
    branches: [main]
    paths: ['fundos/**', 'fundos.json', 'tools/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: catalogo, cancel-in-progress: false }
jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python tools/gerar_catalogo.py
      - name: Salvar catálogo e miniaturas
        run: |
          git config user.name "catalogo-bot"
          git config user.email "catalogo-bot@users.noreply.github.com"
          git add -A catalog.json thumbs 2>/dev/null || git add catalog.json
          git diff --cached --quiet || (git commit -m "Atualiza catálogo de fundos" && git push)
